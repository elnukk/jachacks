[project]
name = "crosswalk"
version = "0.1.0"
description = "Finding the research your R&D team didn't know to look for"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.6"

[dependencies]
requests = "~=2.34"
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
react-force-graph-2d = "latest"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]

[client.app_meta_data]
title = "Crosswalk"
description = "Finding the research your R&D team didn't know to look for"

[byllm.model]
default_model = "claude-haiku-4-5-20251001"
api_key = "${ANTHROPIC_API_KEY}"
